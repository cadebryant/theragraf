name: Build, Test & Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Theragraf.Functions/Theragraf.Functions.csproj'
  PUBLISH_DIR: '${{ github.workspace }}/publish'
  AZURE_FUNCTIONAPP_NAME: 'theragraf-functions'
  AZURE_RESOURCE_GROUP: 'theragraf-rg'
  AZURE_STATIC_WEBAPP_NAME: 'theragraf-web-prod'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── .NET — build, test, and deploy Function App ───────────────────────

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish Functions app
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Create deployment ZIP
        run: cd ${{ env.PUBLISH_DIR }} && zip -r ${{ github.workspace }}/publish.zip .

      - name: Azure login
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Stop Azure Functions before deploy
        run: az functionapp stop --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" --name "${{ env.AZURE_FUNCTIONAPP_NAME }}"

      - name: Deploy to Azure Functions
        run: |
          az functionapp deploy \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --src-path "${{ github.workspace }}/publish.zip" \
            --type zip

      - name: Start Azure Functions after deploy
        run: az functionapp start --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" --name "${{ env.AZURE_FUNCTIONAPP_NAME }}"

      - name: Disable App Service Easy Auth
        run: |
          az rest --method PUT \
            --uri "https://management.azure.com/subscriptions/$(az account show --query id -o tsv)/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Web/sites/${{ env.AZURE_FUNCTIONAPP_NAME }}/config/authsettingsV2?api-version=2022-03-01" \
            --headers "Content-Type=application/json" \
            --body '{"properties":{"globalValidation":{"requireAuthentication":false,"unauthenticatedClientAction":"AllowAnonymous"},"platform":{"enabled":false}}}'

      # ── React / Vite — build and deploy Static Web App ───────────────────

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Theragraf.Web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: Theragraf.Web

      - name: Build web app
        run: npm run build
        working-directory: Theragraf.Web

      - name: Include Static Web Apps config
        run: cp "${{ github.workspace }}/Theragraf.Web/staticwebapp.config.json" "${{ github.workspace }}/Theragraf.Web/dist/staticwebapp.config.json"

      - name: Install Static Web Apps CLI
        run: npm install -g @azure/static-web-apps-cli

      - name: Deploy to Azure Static Web Apps
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        run: |
          swa deploy "${{ github.workspace }}/Theragraf.Web/dist" \
            --deployment-token "$SWA_DEPLOYMENT_TOKEN" \
            --env production
