name: Build, Test & Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Theragraf.Functions/Theragraf.Functions.csproj'
  PUBLISH_DIR: '${{ github.workspace }}/publish'
  AZURE_FUNCTIONAPP_NAME: 'theragraf-functions'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish Functions app
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --no-build \
            --output ${{ env.PUBLISH_DIR }}

      - name: Create deployment ZIP
        run: |
          cd ${{ env.PUBLISH_DIR }}
          zip -r ${{ github.workspace }}/publish.zip .

      - name: Deploy via Kudu ZIP API
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          USERNAME=$(python3 -c "
          import os, xml.etree.ElementTree as ET
          tree = ET.fromstring(os.environ['PUBLISH_PROFILE'])
          profile = next(p for p in tree.findall('publishProfile')
                         if p.get('publishMethod') == 'MSDeploy')
          print(profile.get('userName'))
          ")
          PASSWORD=$(python3 -c "
          import os, xml.etree.ElementTree as ET
          tree = ET.fromstring(os.environ['PUBLISH_PROFILE'])
          profile = next(p for p in tree.findall('publishProfile')
                         if p.get('publishMethod') == 'MSDeploy')
          print(profile.get('userPWD'))
          ")

          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            "https://${{ env.AZURE_FUNCTIONAPP_NAME }}.scm.azurewebsites.net/api/zipdeploy" \
            --user "$USERNAME:$PASSWORD" \
            --data-binary @${{ github.workspace }}/publish.zip \
            --header "Content-Type: application/zip")

          echo "Kudu response: $HTTP_STATUS"
          cat /tmp/deploy_response.txt
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Deployment failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Deployment succeeded"
